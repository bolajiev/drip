[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

remappings = [
    "@prb/math/=lib/prb-math/",
]
via_ir = true

[fmt]
line_length = 120

[rpc_endpoints]
coston2 = "https://coston2-api.flare.network/ext/C/rpc"
